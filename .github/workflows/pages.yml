name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:all
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # For the IndexNow ping after deploy (scripts/indexnow.mjs reads it).
      - uses: actions/upload-artifact@v4
        with:
          name: sitemap
          path: dist/sitemap.xml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
      # Tell search engines (IndexNow: Bing, Yandex, ...) about every page in the sitemap.
      # Best effort: never fails the deploy.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          sparse-checkout: scripts
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: sitemap
          path: indexnow
      - name: Submit URLs to IndexNow
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: node scripts/indexnow.mjs indexnow/sitemap.xml
