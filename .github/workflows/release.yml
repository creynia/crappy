name: Release

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:single

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" dist-single/crappy.html --generate-notes

      - name: Update rolling latest-build prerelease
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete latest-build --cleanup-tag -y || true
          gh release create latest-build dist-single/crappy.html \
            --prerelease --target "$GITHUB_SHA" --title "Latest build" \
            --notes "Rolling build of main at $GITHUB_SHA. Download crappy.html and open it in Chrome; it works offline."
